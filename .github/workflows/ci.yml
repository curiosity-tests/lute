name: CI
run-name: "CI ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:
    branches: ["primary", "release/**"]
  pull_request:
    branches: ["primary"]
  merge_group:
    branches: ["primary"]

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
# CI on the "primary" branch opts out of concurrency grouping by using the run's
# unique run_id.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/primary' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  run-lutecli-luau-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      matrix:
        include:
        - os: ubuntu-latest
          options: --c-compiler gcc --cxx-compiler g++ --enable-sanitizers
          run-on-event: pull_request
        - os: ubuntu-latest
          options: --c-compiler clang --cxx-compiler clang++ --enable-sanitizers
          run-on-event: pull_request
        - os: ubuntu-latest
          options: --c-compiler gcc --cxx-compiler g++ --enable-sanitizers
          use-bootstrap: true
          run-on-event: push
        - os: ubuntu-latest
          options: --c-compiler clang --cxx-compiler clang++ --enable-sanitizers
          use-bootstrap: true
          run-on-event: push
        - os: ubuntu-latest
          options: --c-compiler gcc --cxx-compiler g++ --enable-sanitizers
          use-bootstrap: true
          run-on-event: merge_group
        - os: ubuntu-latest
          options: --c-compiler clang --cxx-compiler clang++ --enable-sanitizers
          use-bootstrap: true
          run-on-event: merge_group
      fail-fast: false

    steps:
    - name: Determine if this matrix job should run
      id: should_run
      shell: bash
      run: |
        if [[ "${{ matrix.run-on-event }}" == "all" || "${{ matrix.run-on-event }}" == "${{ github.event_name }}" ]]; then
          echo "proceed=true" >> "$GITHUB_OUTPUT"
        else
          echo "proceed=false" >> "$GITHUB_OUTPUT"
        fi

    - uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
    - name: Setup and Build Lute
      id: build_lute
      if: ${{ steps.should_run.outputs.proceed == 'true' }}
      uses: ./.github/actions/setup-and-build
      with:
        target: Lute.CLI
        config: debug
        options: ${{ matrix.options }}
        token: ${{ secrets.GITHUB_TOKEN }}
        use-bootstrap: ${{ matrix.use-bootstrap || 'false' }}

    - name: Mount cross-device tmpfs for fs.move test
      if: ${{ steps.should_run.outputs.proceed == 'true' && runner.os == 'Linux' }}
      run: |
        sudo mkdir /mnt/lute-test-tmp
        sudo mount -t tmpfs tmpfs /mnt/lute-test-tmp
        sudo chmod 777 /mnt/lute-test-tmp
        echo "LUTE_CROSSDEV_TMPDIR=/mnt/lute-test-tmp" >> "$GITHUB_ENV"

    - name: Mount cross-device RAM disk for fs.move test
      if: ${{ steps.should_run.outputs.proceed == 'true' && runner.os == 'macOS' }}
      run: |
        DISK=$(hdiutil attach -nomount ram://131072 | xargs)
        diskutil erasevolume HFS+ 'LuteTestDisk' "$DISK"
        echo "LUTE_CROSSDEV_TMPDIR=/Volumes/LuteTestDisk" >> "$GITHUB_ENV"

    - name: Set up cross-device directory for fs.move test
      if: ${{ steps.should_run.outputs.proceed == 'true' && runner.os == 'Windows' }}
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "D:\lute-test-tmp"
        echo "LUTE_CROSSDEV_TMPDIR=D:\lute-test-tmp" >> $env:GITHUB_ENV

    - name: Run Luau Tests
      if: ${{ steps.should_run.outputs.proceed == 'true' }}
      run: ${{ steps.build_lute.outputs.exe_path }} test --verbose
    - name: Run Luau Snapshots
      if: ${{ steps.should_run.outputs.proceed == 'true' }}
      run: ${{ steps.build_lute.outputs.exe_path }} test snapshots

    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  run-lute-cxx-unittests:
