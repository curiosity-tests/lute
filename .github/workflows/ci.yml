  lute-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
    - name: Setup and Build Lute
      id: build_lute
      uses: ./.github/actions/setup-and-build
      with:
        target: Lute.CLI
        config: debug
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Run Lute Check
      shell: bash
      run: |
        # @lute typechecks
        find definitions -name "*.luau" -exec ${{ steps.build_lute.outputs.exe_path }} check {} +
        # @std and @cli commands typechecks
        find lute -name "*.luau" -not -path '*/extern/*' -exec ${{ steps.build_lute.outputs.exe_path }} check {} +
        # @batteries typechecks
        find batteries -name "*.luau" -exec ${{ steps.build_lute.outputs.exe_path }} check {} +
        # All tests typecheck (special case for tests/src because they mess with config files)
        find tests -name "*.luau" -not -path "tests/src/*" -exec ${{ steps.build_lute.outputs.exe_path }} check {} +
        # All tools typecheck
        find tools -name "*.luau" -exec ${{ steps.build_lute.outputs.exe_path }} check {} +
        # All examples typecheck
        find examples -name "*.luau" -exec ${{ steps.build_lute.outputs.exe_path }} check {} +

    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
